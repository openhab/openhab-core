auth.login.prompt = Connectez-vous pour accorder l'accès <b>%s</b> à  <b>%s</b>\:
auth.login.prompt.external = Ce site externe demande à utiliser votre serveur openHAB en tant que vous, avec toutes vos autorisations.
auth.login.prompt.external.warning = Continuez seulement si vous avez démarré depuis ce site et si son nom est exactement celui attendu. Vérifiez chaque lettre \: un nom qui diffère d’un seul caractère, ou auquel des mots ont été ajoutés avant ou après, désigne une autre personne.
auth.login.prompt.external.uri = L'accès sera envoyé à \: %s
auth.login.prompt.external.confirm = Saisissez le nom du site pour confirmer, puis connectez-vous \:
auth.login.fail = Veuillez réessayer.
auth.redirect.signup.required = Un site externe demande l'accès, mais cet instance openHAB ne dispose pas encore de compte utilisateur. Veuillez créer votre premier compte directement dans openHAB, puis réessayez.
auth.redirect.confirm.fail = Le nom de site que vous avez saisi ne correspond pas. Vérifiez-le attentivement ou annulez.
auth.redirect.continue = Connexion effectuée. Retour à %s...
auth.createaccount.prompt = Créez un premier compte administrateur pour continuer.

auth.changepassword.success = Mot de passe modifié.

auth.createapitoken.prompt = Créez des jetons d'API pour autoriser des services externes.
auth.createapitoken.name.unique.fail = Un jeton avec le même nom existe déjà , veuillez réessayer.
auth.createapitoken.name.format.fail = Nom de jeton invalide, merci d'utiliser uniquement des caractères alphanumériques.
auth.createapitoken.success = Nouveau jeton créé\:
auth.createapitoken.success.footer = Veuillez le copier maintenant, il ne sera plus possible de le voir à nouveau.

auth.password.confirm.fail = Les mots de passe ne correspondent pas, veuillez réessayer.

