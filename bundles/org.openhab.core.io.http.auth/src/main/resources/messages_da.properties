auth.login.prompt = Log ind for at give <b>%s</b> adgang til <b>%s</b>\:
auth.login.prompt.external = Dette eksterne websted beder om at bruge din openHAB som dig, med alle dine tilladelser.
auth.login.prompt.external.warning = Fortsæt kun, hvis du startede dette fra dette websted, og dets navn er præcis, hvad du forventer. Tjek hvert bogstav\: et navn der er slået fra med et tegn, eller har ekstra ord tilføjet før eller efter det, tilhører en anden.
auth.login.prompt.external.uri = Adgang vil blive sendt til\: %s
auth.login.prompt.external.confirm = Skriv webstedsnavnet for at bekræfte, log derefter ind\:
auth.login.fail = Prøv venligst igen.
auth.redirect.signup.required = Et eksternt websted beder om adgang, men denne openHAB har endnu ingen brugerkonto. Opret venligst din første konto i openHAB selv, og prøv derefter igen.
auth.redirect.confirm.fail = Det indtastede webstedsnavn stemmer ikke overens. Kontrollér det omhyggeligt, eller annuller.
auth.redirect.continue = Logget ind. Tager dig tilbage til %s...
auth.createaccount.prompt = Opret en første administratorkonto for at fortsætte.

auth.changepassword.success = Adgangskode ændret.

auth.createapitoken.prompt = Opret et nyt API-token for at godkende eksterne tjenester.
auth.createapitoken.name.unique.fail = Der findes allerede et token med samme navn. Prøv venligst igen.
auth.createapitoken.name.format.fail = Ugyldigt token-navn, benyt venligst kun alfanumeriske tegn.
auth.createapitoken.success = Nyt token oprettet\:
auth.createapitoken.success.footer = Kopier det venligst nu, det vil ikke blive vist igen.

auth.password.confirm.fail = Adgangskoderne matcher ikke, forsøg venligst igen.

auth.placeholder.username = Brugernavn
auth.placeholder.password = Adgangskode
auth.placeholder.newpassword = Ny adgangskode
auth.placeholder.repeatpassword = Bekræft ny adgangskode
auth.placeholder.tokenname = Token-navn (alfanumerisk)
auth.placeholder.tokenscope = Token-scope (valgfrit)
auth.placeholder.confirmhost = Skriv venligst %s

auth.button.signin = Log ind
auth.button.createaccount = Opret konto
auth.button.changepassword = Skift adgangskode
auth.button.createapitoken = Opret API-token
auth.button.return = Retur til hjem
auth.button.cancel = Annuller
