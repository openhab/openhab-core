auth.login.prompt = Anmelden, um <b>%s</b>-Zugriff auf <b>%s</b> zu gewähren\:
auth.login.prompt.external = Diese externe Seite möchte Ihr openHAB in Ihrem Namen und mit all Ihren Berechtigungen nutzen.
auth.login.prompt.external.warning = Fahren Sie nur fort, wenn Sie diesen Vorgang selbst auf dieser Seite gestartet haben und ihr Name genau dem entspricht, was Sie erwarten. Prüfen Sie jeden Buchstaben\: Ein Name, der um ein Zeichen abweicht oder vor bzw. nach dem zusätzliche Wörter stehen, gehört jemand anderem.
auth.login.prompt.external.uri = Die Zugangsberechtigung wird gesendet an\: %s
auth.login.prompt.external.confirm = Geben Sie zur Bestätigung den Namen der Seite ein und melden Sie sich dann an\:
auth.login.fail = Bitte erneut versuchen.
auth.redirect.signup.required = Eine externe Seite bittet um Zugriff, aber in diesem openHAB gibt es noch kein Benutzerkonto. Bitte erstellen Sie Ihr erstes Konto direkt in openHAB und versuchen Sie es dann erneut.
auth.redirect.confirm.fail = Der eingegebene Seitenname stimmt nicht überein. Prüfen Sie ihn sorgfältig oder brechen Sie ab.
auth.redirect.continue = Angemeldet. Sie werden zurück zu %s geleitet...
auth.createaccount.prompt = Erstelle ein Administrator-Konto, um fortzufahren.

auth.changepassword.success = Passwort geändert.

auth.createapitoken.prompt = Erstelle einen neuen Token, um externe Dienste zu autorisieren.
auth.createapitoken.name.unique.fail = Ein Token mit dem selben Namen existiert bereits. Bitte erneut versuchen.
auth.createapitoken.name.format.fail = Ungültiger Token Name. Bitte nutzen Sie nur alphanumerische Zeichen.
auth.createapitoken.success = Neuer Token erstellt\:
auth.createapitoken.success.footer = Bitte kopieren Sie ihn jetzt, da er anschließend nicht mehr angezeigt wird.

auth.password.confirm.fail = Passwörter stimmen nicht überein. Bitte erneut versuchen.

auth.placeholder.username = Benutzername
auth.placeholder.password = Passwort
auth.placeholder.newpassword = Neues Passwort
auth.placeholder.repeatpassword = Passwort wiederholen
auth.placeholder.tokenname = Name des Tokens (alphanumerisch)
auth.placeholder.tokenscope = Scope für Token (optional)
auth.placeholder.confirmhost = Bitte %s eingeben

auth.button.signin = Anmelden
auth.button.createaccount = Konto erstellen
auth.button.changepassword = Passwort ändern
auth.button.createapitoken = Neuen Token erstellen
auth.button.return = Zur Startseite
auth.button.cancel = Abbrechen
