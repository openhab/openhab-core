system.config.inbox.autoApprove.label = Auto Approve Everything Unconditionally
system.config.inbox.autoApprove.description = If enabled, all discovered things are automatically approved without evaluating rules, unless the inbox entry is ignored.
system.config.inbox.autoApproveRules.label = Auto Approve Rules
system.config.inbox.autoApproveRules.description = Rules are evaluated sequentially until a match is found.<br> Syntax: <code>criteriaKey=value; actionKey=value</code> (Prefix with <code>#</code> or <code>//</code> to disable a rule)<br> <b>Filters:</b> <code>thingUid</code>, <code>bridgeUid</code>, <code>label</code>, <code>representationProperty</code>, <code>propertyMatch</code>, <code>configMatch</code><br> <b>Actions:</b> <code>setLabel</code>, <code>setLocation</code>, <code>setProperties</code>, <code>setConfig</code> (optional post-approval customizations)<br> <b>Example:</b> <code>thingUid=hue:*; label=*Motion*; setLocation=Living Room; setLabel=${label} Sensor</code>
system.config.inbox.autoApproveRulesEnabled.label = Enable Rule-Based Auto Approval
system.config.inbox.autoApproveRulesEnabled.description = If enabled, discovered things are matched against defined rules below and automatically approved.<br> <b>Note:</b> Auto-approved items bypass the Inbox and appear directly under <b>Settings → Things</b>.
system.config.inbox.autoIgnore.label = Auto Ignore
system.config.inbox.autoIgnore.description = If enabled, an Inbox result matching an existing thing is automatically ignored.<br>If set to false, the Inbox may contain results although identical things already exist.
system.config.inbox.group.rules.label = Rule-Based Auto Approval
system.config.inbox.group.rules.description = Automatically approve discovered things based on custom matching criteria and actions.

service.system.inbox.label = Inbox
