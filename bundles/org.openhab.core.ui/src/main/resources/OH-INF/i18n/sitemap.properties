system.config.sitemap.groupMembersSorting.label = Group Members Sorting
system.config.sitemap.groupMembersSorting.description = Defines how the members of a group are sorted in UI.
system.config.sitemap.groupMembersSorting.option.NONE = No sorting
system.config.sitemap.groupMembersSorting.option.LABEL = Sorted by label
system.config.sitemap.groupMembersSorting.option.NAME = Sorted by name
system.config.sitemap.allowedHosts.label = Allowed Proxy Hosts
system.config.sitemap.allowedHosts.description = Comma-separated list of hosts (host or host:port) for which the URL held by an item bound to an Image or Video widget may be proxied. If empty, the URL defined in the sitemap is always used.
system.config.sitemap.maxProxyThreads.label = Max Proxy Threads
system.config.sitemap.maxProxyThreads.description = Maximum number of threads used by the proxy serving Image and Video widget content. If not set, the larger of 8 and the number of processors is used.

service.system.sitemap.label = Sitemap
