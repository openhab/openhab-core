system.config.sitemap.groupMembersSorting.label = Tri des membres d'un groupe
system.config.sitemap.groupMembersSorting.description = Définit comment les membres d'un groupe sont triés dans l'interface utilisateur.
system.config.sitemap.groupMembersSorting.option.NONE = Aucun tri
system.config.sitemap.groupMembersSorting.option.LABEL = Tri par libellé
system.config.sitemap.groupMembersSorting.option.NAME = Tri par nom
system.config.sitemap.groupMembersSorting.option.METADATA = Tri par l'ordre défini dans les métadonnées
system.config.sitemap.commandConfirmDialogMessage.label = Message de confirmation de commande
system.config.sitemap.commandConfirmDialogMessage.description = Définit le message par défaut à afficher dans les boîtes de dialogue de confirmation de commande dans l'interface utilisateur.
system.config.sitemap.commandConfirmDialogMessage.default = Es-tu sûr ?
system.config.sitemap.allowedHosts.label = Hôtes autorisés au proxy
system.config.sitemap.allowedHosts.description = Liste d'hôtes séparés par des virgules (hôte ou hôte\:port) pour lesquels l'URL définie par un élément de type Image ou Video peut être accédée via un mécanisme de proxy. Si vide, l'URL définie dans la sitemap est toujours utilisée.
system.config.sitemap.maxProxyThreads.label = Maximum de threads pour le proxy
system.config.sitemap.maxProxyThreads.description = Nombre maximum de threads utilisés par le proxy servant le contenu des éléments de type Image et Video. Si non défini, le plus grand nombre entre 8 et le nombre de processeurs est utilisé.

service.system.sitemap.label = Sitemap
