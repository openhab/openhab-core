system.config.sitemap.commandConfirmDialogMessage.label = Nachricht in Bestätigungsdialogen
system.config.sitemap.commandConfirmDialogMessage.description = Definiert die Standardnachricht, die in den Bestätigungsdialogen der Benutzeroberfläche angezeigt wird.
system.config.sitemap.commandConfirmDialogMessage.default = Sind Sie sicher?
system.config.sitemap.allowedHosts.label = Erlaubte Proxy-Hosts
system.config.sitemap.allowedHosts.description = Kommaseparierte Liste von Hosts (Host oder host\:port), für die die URL eines Elements, das an ein Bild oder ein Video-Widget gebunden ist, weitergeleitet werden kann. Wenn leer, wird immer die in der Sitemap definierte URL verwendet.
system.config.sitemap.maxProxyThreads.label = Maximale Anzahl Proxy-Threads
system.config.sitemap.maxProxyThreads.description = Maximale Anzahl der Threads, die vom Proxy verwendet werden, der Bild- und Video-Widget-Inhalt zur Verfügung stellt. Wenn nicht gesetzt, wird die entweder 8 oder die Anzahl der Prozessoren verwendet, je nach dem was größer ist.

