system.config.restauth.allowBasicAuth.label = Basic Authentication Erlauben
system.config.restauth.allowBasicAuth.description = Erlaubt die Verwendung von Basic Authentication für den Zugriff auf geschützte API-Ressourcen, zusätzlich zu Access-Tokens und API-Tokens.
system.config.restauth.allowExternalSites.label = Externe Seiten erlauben
system.config.restauth.allowExternalSites.description = Erlaubt externen Seiten (z. B. KI-Assistenten), Zugriff auf openHAB anzufordern. Der sich anmeldende Benutzer muss die Seite durch Eingabe ihres Namens bestätigen. Deaktivieren, um Anmeldungen nur für die eigenen Seiten dieser openHAB-Instanz zuzulassen.
system.config.restauth.cacheExpiration.label = Ablaufzeit des Zwischenspeichers
system.config.restauth.cacheExpiration.description = Wenn Basic Authentication aktiviert ist, werden die Zugangsdaten in einen Cache gelegt, um die Autorisierung der Anfrage zu beschleunigen. Die Einträge im Cache laufen nach einer Weile ab, um Anmeldedaten nicht unbegrenzt im Speicher zu halten. Dieser Wert definiert die Ablaufzeit in Stunden. Auf 0 setzen, um den Cache zu deaktivieren.
system.config.restauth.implicitUserRole.label = Implizite Benutzerrolle
system.config.restauth.implicitUserRole.description = Standardmäßig sind alle API-Ressourcen ohne Authentifizierung verfügbar, sofern sie die "user"-Rolle erfordern. Eine Deaktivierung dieser Option erzwingt die Autorisierung für diese Operationen. Warnung\: Dies führt dazu, dass Clients, die keine Authentifizierung unterstützen, die API-Ressourcen nicht mehr nutzen können.
system.config.restauth.trustedNetworks.label = Vertrauenswürdige Netzwerke
system.config.restauth.trustedNetworks.description = Gewährt Anfragen, deren direkte Quelle in diesen Netzwerken liegt, eine implizite Benutzerrolle; kommaseparierte Liste von CIDRs. Forwarded-Header werden nicht berücksichtigt (wird ignoriert, wenn „Implicit User Role“ aktiviert ist).

service.system.restauth.label = API-Sicherheit
